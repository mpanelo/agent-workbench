[workspace]
members = ["crates/workbench-core", "crates/workbench-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt", "process", "sync", "time"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
workbench-core = { path = "crates/workbench-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
